spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

app:
  jwt:
    secret: TestSecretKeyForUnitTestingPurposeOnlyMinimum256BitsLong
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"
  storage:
    photos-dir: target/test-storage/photos
