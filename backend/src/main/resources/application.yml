spring:
  application:
    name: field-service-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fieldservice}
    username: ${DB_USERNAME:fieldservice}
    password: ${DB_PASSWORD:fieldservice}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisToASecureRandomSecretInProductionAtLeast256Bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  storage:
    photos-dir: ${PHOTO_STORAGE_DIR:storage/photos}

logging:
  level:
    com.fieldservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
